[pytest]
testpaths = tests/ui
pythonpath = ../..
addopts = -ra --strict-markers --strict-config -p utils.pytest_plugin --alluredir=data/results/direct/allure-results --clean-alluredir
cache_dir = data/.cache/pytest
timeout = 240
timeout_method = thread
markers =
    positive: допустимые действия и успешные пользовательские маршруты
    negative: отклонение некорректных данных или запрещённого действия
    special: получение списка Automation Tools через Selenium и заполнение Message
    calendars: страница Calendars
    modals: страница Modals
    ads: страница Ads
    form_fields: страница Form Fields
