[project]
name = "practice-automation-ui"
version = "1.0.0"
description = "Selenium UI tests for practice-automation.com"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["node_modules", ".venv", ".runtime", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
